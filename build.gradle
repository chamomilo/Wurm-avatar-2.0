plugins {
    id 'java'
}

group = 'org.avatar2'
version = '0.15.2'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

def clientLibraries = [
        'libs/client-patched.jar',
        'libs/common.jar',
        'libs/javassist.jar',
        'libs/modlauncher.jar'
]
def wurmJavaFx = file('C:/Program Files (x86)/Steam/steamapps/common/Wurm Unlimited/runtime/lib/ext/jfxrt.jar')
clientLibraries.each { library ->
    if (!file(library).isFile()) {
        throw new GradleException("Required pinned client library is missing: ${library}")
    }
}

repositories { mavenCentral() }

dependencies {
    compileOnly files(clientLibraries)
    testImplementation files(clientLibraries)
    testImplementation files('libs/junit-4.13.2.jar', 'libs/hamcrest-core-1.3.jar')
    if (wurmJavaFx.isFile()) testRuntimeOnly files(wurmJavaFx)
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    systemProperty 'avatar2ProjectDir', projectDir.absolutePath
    systemProperty 'sun.net.http.allowRestrictedHeaders', 'true'
    systemProperty 'java.library.path',
            'C:/Program Files (x86)/Steam/steamapps/common/Wurm Unlimited/WurmLauncher/nativelibs'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

task sourceDist(type: Zip) {
    archiveFileName = "avatar2-sources-${project.version}.zip"
    destinationDirectory = file("${buildDir}/distributions")
    from(projectDir) {
        include 'src/**', 'docs/**', 'config/**', 'mods/avatar2.properties',
                'tools/animation-lab/*.py', 'tools/blender/*.py', 'tools/blender/scripts/*.py',
                'tools/*.ps1', 'tools/prepare_age_skins.py', 'tools/verify_body_age.py', 'assets/metadata/**', 'assets/runtime/**', 'resource-pack/**',
                'build.gradle', 'settings.gradle', 'gradle/**', 'gradlew', 'gradlew.bat',
                'README.md', 'README.txt', 'CHANGELOG.md', 'LICENSE', 'COPYING', 'NOTICE.md', '.gitignore', '.gitattributes',
                'chamomilo-updater.lock.properties'
        exclude '**/__pycache__/**'
    }
}

jar {
    archiveFileName = "avatar2-${project.version}.jar"
    into('META-INF/licenses/avatar2') { from 'LICENSE', 'COPYING', 'NOTICE.md' }
}

// Keep the four historical control bodies in authoring sources, while shipping
// only the two validated Shape bindings and their matching metadata.
task prepareCanonicalBodyResources {
    inputs.files('assets/runtime/body/body-manifest.json', 'assets/runtime/body/properties.xml')
    outputs.dir("${buildDir}/canonical-body")
    doLast {
        def target = file("${buildDir}/canonical-body")
        target.mkdirs()
        def manifest = new groovy.json.JsonSlurper().parse(file('assets/runtime/body/body-manifest.json'))
        manifest.variants = manifest.variants.findAll { it.name in ['male-bodybuilder','female-bodybuilder'] }
        if (manifest.variants*.name.toSet() != ['male-bodybuilder','female-bodybuilder'].toSet())
            throw new GradleException('Missing canonical body metadata')
        new File(target,'body-manifest.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)), 'UTF-8')
        def properties = new XmlParser().parse(file('assets/runtime/body/properties.xml'))
        properties.children().findAll { it.name().toString().endsWith('-athletic.dae') }.each { properties.remove(it) }
        new File(target,'properties.xml').setText(groovy.xml.XmlUtil.serialize(properties), 'UTF-8')
    }
}

task avatarResources(type: Jar, dependsOn: prepareCanonicalBodyResources) {
    archiveFileName = "avatar2-resources-${project.version}.jar"
    destinationDirectory = file("${buildDir}/resources-pack")
    from('resource-pack')
    into('avatar2/body') {
        from('assets/runtime/body') {
            include '**/*.dae', '**/*.png'
            exclude '*-athletic.dae'
        }
        from("${buildDir}/canonical-body") { include 'body-manifest.json', 'properties.xml' }
    }
    into('avatar2/morph') { from('assets/runtime/morph') { include '*.avm' } }
    into('META-INF/licenses/avatar2') { from 'docs/THIRD_PARTY_ASSETS.md' }
}

task verifyCanonicalBodies(dependsOn: avatarResources) {
    doLast {
        def packed = zipTree(avatarResources.archiveFile.get().asFile)
        def bodies = packed.matching { include 'avatar2/body/*.dae' }.files*.name.toSet()
        if (bodies != ['male-bodybuilder.dae','female-bodybuilder.dae'].toSet())
            throw new GradleException('Resource pack must contain exactly two canonical bodies')
        def manifest = new groovy.json.JsonSlurper().parse(packed.matching { include 'avatar2/body/body-manifest.json' }.singleFile)
        if (manifest.variants*.name.toSet() != ['male-bodybuilder','female-bodybuilder'].toSet())
            throw new GradleException('Resource pack body metadata differs from canonical bodies')
        def properties = new XmlParser().parse(packed.matching { include 'avatar2/body/properties.xml' }.singleFile)
        if (properties.children()*.name().toSet() != bodies)
            throw new GradleException('Resource pack animation bindings differ from canonical bodies')
        def mappings = packed.matching { include 'mappings.txt' }.singleFile.getText('UTF-8')
        if (mappings.contains('.athletic') || mappings.contains('-athletic.dae'))
            throw new GradleException('Resource pack contains a retired Athletic mapping')
    }
}

task verifyArtifact(dependsOn: jar) {
    doLast {
        def contents = zipTree(jar.archiveFile.get().asFile)
        [
                'org/avatar2/client/Avatar2Mod.class',
                'org/avatar2/client/AvatarGeometryPrototype.class',
                'org/avatar2/client/AvatarHeightPrototype.class',
                'org/avatar2/client/AvatarLocomotion.class',
                'org/avatar2/client/AvatarEquipmentSockets.class',
                'org/avatar2/client/AvatarFirstPerson.class',
                'org/avatar2/client/AvatarAgeSkin.class',
                'org/avatar2/client/AvatarHair.class',
                'org/avatar2/client/AvatarScalp.class',
                'org/avatar2/client/AvatarHairDetail.class',
                'org/avatar2/core/AgeSkin.class',
                'org/avatar2/core/FirstPersonCut.class',
                'org/avatar2/core/HeightLimits.class',
                'org/avatar2/core/GeometryProbe.class',
                'org/avatar2/core/MorphBank.class',
                'org/avatar2/client/AvatarStudioController.class',
                'com/wurmonline/client/renderer/model/collada/animation/AvatarWalkMotion.class',
                'org/avatar2/core/AvatarProfile.class',
                'org/avatar2/core/MaterialReflection.class',
                'org/avatar2/core/OutfitLayerRules.class',
                'com/wurmonline/client/renderer/gui/AvatarStudioWindow.class',
                'org/avatar2/lab/AnimationLab.class',
                'org/avatar2/client/AvatarShieldWalk.class',
                'org/avatar2/lab/LabPageResource.class',
                'org/avatar2/lab/dashboard.html'
        ].each { requiredClass ->
            if (contents.matching { include requiredClass }.files.empty) {
                throw new GradleException("Avatar 2.0 artifact is missing ${requiredClass}")
            }
        }
    }
}

task verifyModDescriptor(dependsOn: jar) {
    doLast {
        Properties descriptor = new Properties()
        file('mods/avatar2.properties').withInputStream { descriptor.load(it) }
        String expected = jar.archiveFile.get().asFile.name
        if (descriptor.getProperty('classpath') != expected) {
            throw new GradleException("Mod classpath must be relative to mods/avatar2: "
                    + "expected ${expected}, got ${descriptor.getProperty('classpath')}")
        }
        [sharedClassLoader: 'true', updateProvider: 'chamomilo',
         updateCoordinatorProtocol: '1', updateId: 'avatar2', updateName: 'Avatar 2.0',
         updateRepo: 'chamomilo/Wurm-avatar-2.0', updateAsset: 'avatar2-{version}.zip',
         resourcePack: "mods/avatar2/avatar2-resources-${project.version}.jar".toString(),
         version: project.version.toString()].each { key, value ->
            if (descriptor.getProperty(key) != value)
                throw new GradleException("Invalid shared updater metadata: ${key}")
        }
    }
}

task verifyMorphSources(dependsOn: avatarResources) {
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(file('assets/metadata/morph-prototype.json'))
        if (manifest.schema != 1 || manifest.bodies*.body.toSet() != ['male-bodybuilder', 'female-bodybuilder'].toSet())
            throw new GradleException('Invalid morph provenance manifest')
        def packed = zipTree(avatarResources.archiveFile.get().asFile)
        manifest.bodies.each { row ->
            ['sourceDaeSha256': "assets/runtime/body/${row.body}.dae",
             'bankSha256': "assets/runtime/morph/${row.body}.avm"].each { key, path ->
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file(path).bytes).encodeHex().toString()
                if (digest != row[key]) throw new GradleException("Morph provenance mismatch: ${path}")
            }
            def entries = packed.matching { include "avatar2/morph/${row.body}.avm" }.files
            if (entries.size() != 1 || !java.util.Arrays.equals(entries.first().bytes, file("assets/runtime/morph/${row.body}.avm").bytes))
                throw new GradleException("Resource pack morph mismatch: ${row.body}")
        }
    }
}

task dist(type: Zip, dependsOn: ['test', 'verifyArtifact', 'verifyModDescriptor',
                                 'avatarResources', 'verifyMorphSources', 'verifyGeneratedBodies', 'verifyDashboardRuntime', 'verifyWalkMotionRuntime', 'verifyGeometryRuntime', 'verifyEquipmentSocketsRuntime']) {
    archiveFileName = "avatar2-${project.version}.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into('mods/avatar2') {
        from jar
        from avatarResources
    }
    into('mods') {
        from 'mods/avatar2.properties'
    }
    from 'README.txt'
    doLast {
        def expected = ['README.txt', 'mods/avatar2.properties',
                "mods/avatar2/avatar2-${project.version}.jar".toString(),
                "mods/avatar2/avatar2-resources-${project.version}.jar".toString()].toSet()
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def entries = java.util.Collections.list(archive.entries()).findAll { !it.directory }*.name
            if (entries.size() != expected.size() || entries.toSet() != expected)
                throw new GradleException("Unexpected installable ZIP contents: ${entries}")
        } finally { archive.close() }
    }
}

task verifyAgeSkinSources(dependsOn: avatarResources) {
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(file('assets/metadata/age-skin-prototype.json'))
        if (manifest.schema != 1 || manifest.skins.size() != 6
                || manifest.skins.collect { it.sex + '/' + it.preset }.toSet() !=
                   ['male/young','male/middle','male/old','female/young','female/middle','female/old'].toSet())
            throw new GradleException('Invalid adult skin provenance manifest')
        def packed = zipTree(avatarResources.archiveFile.get().asFile)
        manifest.skins.each { row ->
            def skin = file(row.runtime)
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(skin.bytes).encodeHex().toString()
            if (digest != row.sha256) throw new GradleException('Age skin hash mismatch: ' + row.runtime)
            def entry = packed.matching { include 'avatar2/body/' + skin.name }.files
            if (entry.size() != 1 || !java.util.Arrays.equals(entry.first().bytes, skin.bytes))
                throw new GradleException('Age skin pack mismatch: ' + skin.name)
        }
    }
}
dist.dependsOn verifyAgeSkinSources
dist.dependsOn verifyCanonicalBodies

// Unlike ordinary unit tests, this process deliberately has NO main resources
// on its parent classpath. It uses Wurm's real shared classloader for the JAR.
task verifyDashboardRuntime(type: JavaExec, dependsOn: ['jar', 'testClasses']) {
    classpath = files(sourceSets.test.output.classesDirs) + files(clientLibraries)
    main = 'org.avatar2.lab.DashboardJarProbe'
    args jar.archiveFile.get().asFile.absolutePath
    workingDir file("${buildDir}/dashboard-runtime-client")
    doFirst {
        // This is a build fixture, NOT the user's game/mods installation.
        workingDir.mkdirs()
        copy { from jar; into new File(workingDir, 'mods/avatar2') }
        copy { from 'mods/avatar2.properties'; into new File(workingDir, 'mods') }
    }
}

