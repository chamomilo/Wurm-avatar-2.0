ext.chamomiloUpdate = [id: 'avatar2', name: 'Avatar 2.0', repo: 'chamomilo/Wurm-avatar-2.0',
    asset: 'avatar2-{version}.zip', properties: 'mods/avatar2.properties',
    main: 'src/main/java/org/avatar2/client/Avatar2Mod.java', sourceArchives: ['sourceDist']]
apply from: 'gradle/chamomilo-updater.gradle'
